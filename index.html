<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SkyCast - A premium weather experience with real-time tracking, 24-hour hourly forecasts, and 7-day outlooks. Beautiful glassmorphism design." />
    <title>SkyCast | Premium Weather Experience</title>
    <link rel="stylesheet" href="weather.css" />
</head>

<body>
    <div class="app-wrapper">
        <div class="search-section">
            <form>
                <input type="text" id="city-input" placeholder="Search city..." autocomplete="off" />
                <button type="button" id="location-btn" title="Current Location">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                </button>
                <button type="submit" id="search-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </form>
        </div>

        <main id="weather-data">
            <div class="main-card">
                <div class="current-weather">
                    <div class="weather-header">
                        <h2 id="city-name">SkyCast</h2>
                        <p id="date-now">Ready to explore?</p>
                    </div>
                    <div class="temp-container">
                        <div class="icon"></div>
                        <div class="temp-wrapper">
                            <span class="temperature">--</span>
                            <span class="unit">°C</span>
                        </div>
                    </div>
                    <div class="description">Enter a city to get started</div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">🌡️</div>
                        <div class="stat-info">
                            <span class="stat-label">Feels Like</span>
                            <span class="stat-value" id="feels-like">--</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">💧</div>
                        <div class="stat-info">
                            <span class="stat-label">Humidity</span>
                            <span class="stat-value" id="humidity">--</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🌬️</div>
                        <div class="stat-info">
                            <span class="stat-label">Wind Speed</span>
                            <span class="stat-value" id="wind-speed">--</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">☀️</div>
                        <div class="stat-info">
                            <span class="stat-label">UV Index</span>
                            <span class="stat-value" id="uv-index">--</span>
                        </div>
                    </div>
                </div>

                <div class="hourly-section">
                    <h3>Next 24 Hours</h3>
                    <div class="hourly-container" id="hourly-container">
                        <!-- Hourly items injected here -->
                    </div>
                </div>
            </div>
            </div>

            <div class="forecast-section" id="forecast-container">
                <!-- Forecast items will be injected here -->
            </div>
        </main>
    </div>
    <script src="weather.js"></script>
</body>

</html>
